<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regulament Apartament</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0e0e0e;--card:#1a1a1a;--card2:#222;--border:#2a2a2a;
--gold:#c9a96e;--gold2:#e8d5a8;--gold-dim:#8a7a50;
--text:#f0ede6;--text2:#a09a8e;--text3:#5a5650;--text-rule:#c8c2b8;
--green:#3a9e5c;--red:#d44040;--blue:#5a8fd4;--amber:#d4922a;--purple:#8a7abf;--pink:#c45a7a;
--radius:12px;--checked-bg:rgba(58,158,92,0.06);--bar-bg:rgba(14,14,14,0.92);
}
html.light{
--bg:#f5f3ee;--card:#ffffff;--card2:#faf8f4;--border:#e0dbd2;
--gold:#a6854a;--gold2:#7a6235;--gold-dim:#c9a96e;
--text:#1c1c1a;--text2:#5a5650;--text3:#a09a8e;--text-rule:#4a4640;
--checked-bg:rgba(58,158,92,0.08);--bar-bg:rgba(245,243,238,0.92);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 0 3rem}
.hero{text-align:center;padding:2.5rem 1rem 1.5rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero h1{font-family:'DM Serif Display',serif;font-size:34px;color:var(--gold2);margin-bottom:6px}
.hero p{font-size:15px;color:var(--text2);max-width:420px;margin:0 auto}
.theme-toggle{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:16px}
.theme-toggle:hover{border-color:var(--gold)}
.container{max-width:680px;margin:0 auto;padding:0 1rem}
.section{margin-bottom:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.sec-head{padding:14px 18px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;transition:background .15s}
.sec-head:hover{background:var(--card2)}
.sec-head .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sec-head .title{font-size:19px;font-weight:600;flex:1}
.sec-head .badge{font-size:13px;color:var(--text3);background:var(--bg);padding:2px 8px;border-radius:20px}
.sec-head .arrow{color:var(--text3);font-size:12px;transition:transform .2s}
.sec-head.open .arrow{transform:rotate(180deg)}
.sec-body{display:none;border-top:1px solid var(--border)}
.sec-body.open{display:block}
.rule{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
.rule:last-child{border-bottom:none}
.rule:hover{background:var(--card2)}
.rule.checked{background:var(--checked-bg)}
.cb{width:24px;height:24px;border-radius:6px;border:2px solid var(--text3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:3px}
.rule.checked .cb{background:var(--green);border-color:var(--green)}
.cb svg{width:14px;height:14px;opacity:0;transition:opacity .1s}
.rule.checked .cb svg{opacity:1}
.rule-text{font-size:18px;line-height:1.6;color:var(--text-rule);flex:1}
.rule.checked .rule-text{color:var(--text)}
.rule-edit{outline:none;border-radius:4px;padding:1px 3px;margin:-1px -3px;transition:background .15s}
.rule-edit:focus{background:var(--card2);box-shadow:0 0 0 1px var(--gold)}
.field{margin-top:8px}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;transition:border .15s}
.field input:focus{border-color:var(--gold)}
.field input::placeholder{color:var(--text3)}
.sticky-bar{position:sticky;top:0;z-index:20;background:var(--bar-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 1rem;margin-bottom:1rem}
.sticky-inner{max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.sticky-bar .count{font-size:15px;font-weight:500;color:var(--gold)}
.sticky-bar .status{font-size:13px;color:var(--text3)}
.btn-submit{display:block;width:100%;padding:16px;background:var(--gold);color:#0e0e0e;border:none;border-radius:var(--radius);font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;margin-top:1.5rem;transition:all .15s}
.btn-submit:hover{opacity:.85}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.success{display:none;text-align:center;padding:3rem 1rem}
.success.show{display:block}
.success .check-circle{width:64px;height:64px;border-radius:50%;background:rgba(58,158,92,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.success .check-circle svg{width:32px;height:32px;color:var(--green)}
.success h2{font-family:'DM Serif Display',serif;font-size:26px;color:var(--gold2);margin-bottom:8px}
.success p{font-size:15px;color:var(--text2);max-width:340px;margin:0 auto}
.form-wrap{display:block}
.form-wrap.hidden{display:none}
.btn-another{margin-top:1.5rem;padding:12px 28px;background:transparent;border:1px solid var(--border);border-radius:var(--radius);color:var(--text2);font-family:inherit;font-size:15px;cursor:pointer;transition:all .15s}
.btn-another:hover{border-color:var(--gold);color:var(--gold)}
.add-box{border:1px dashed var(--border);border-radius:var(--radius);padding:16px;margin-top:16px;background:var(--card)}
.add-box h3{font-size:17px;font-weight:600;color:var(--text);margin-bottom:10px}
.add-row{display:flex;gap:8px;margin-bottom:8px}
.add-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:15px;color:var(--text);font-family:inherit;outline:none;transition:border .15s}
.add-row input:focus{border-color:var(--gold)}
.add-row input::placeholder{color:var(--text3)}
.add-row button{background:var(--gold);color:#0e0e0e;border:none;border-radius:8px;padding:0 20px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.add-row button:hover{opacity:.85}
.cr{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.cr .cr-chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--green);background:var(--green);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cr .cr-chk svg{width:10px;height:10px}
.cr .cr-text{flex:1;font-size:15px;color:var(--text);outline:none;border-radius:4px;padding:1px 3px}
.cr .cr-text:focus{box-shadow:0 0 0 1px var(--gold);background:var(--card)}
.cr .cr-del{width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.cr .cr-del:hover{background:rgba(212,64,64,0.15);color:var(--red)}
</style>
</head>
<body>

<div class="hero">
<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" title="Schimbă tema">&#9728;&#65039;</button>
<h1>Regulament Apartament</h1>
<p>Selectează regulile potrivite, editează textul dacă vrei, și adaugă reguli noi</p>
</div>

<div class="sticky-bar">
<div class="sticky-inner">
<span class="count" id="count">0 reguli selectate</span>
<span class="status" id="status"></span>
</div>
</div>

<div class="container">
<div class="form-wrap" id="formWrap">
<div id="sections"></div>

<div class="add-box">
<h3>+ Adaugă o regulă nouă</h3>
<div class="add-row">
<input type="text" id="newRuleInput" placeholder="Scrie regula aici și apasă Enter sau Adaugă...">
<button onclick="addCustomRule()">Adaugă</button>
</div>
<div id="customRules"></div>
</div>

<button class="btn-submit" id="submitBtn" onclick="submitForm()">Trimite selecția</button>
</div>

<div class="success" id="successMsg">
<div class="check-circle">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
</div>
<h2>Mulțumim!</h2>
<p>Selecția ta a fost salvată. Proprietarul va vedea răspunsul tău.</p>
<button class="btn-another" onclick="resetForm()">+ Completează din nou</button>
</div>
</div>

<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbxXqDwvTqGc1J-0tVpjkl8r2CdJrtzBqPQgEWhL1dcOxM3yzf_1mehMdjv86ycqBw/exec";
var SECTIONS=[
{id:"fumat",title:"Fumatul",color:"#d44040",rules:[
{id:"r1",text:"Fumatul în interior este strict interzis (inclusiv vape, IQOS, țigări electronice)",on:true},
{id:"r2",text:"Fumatul este permis doar pe balcon",on:true},
{id:"r3",text:"Mucurile de țigară se aruncă în scrumieră, nu pe jos sau peste balcon"}]},
{id:"liniste",title:"Zgomot și liniște",color:"#8a7abf",rules:[
{id:"r4",text:"Liniște după ora 22:00",on:true},
{id:"r5",text:"Petrecerile și evenimentele nu sunt permise",on:true},
{id:"r6",text:"Evitați trântitul ușilor, muzica tare, strigătul"},
{id:"r7",text:"Fiți respectuoși cu vecinii — este o zonă rezidențială"}]},
{id:"ac",title:"Aer condiționat și energie",color:"#5a8fd4",rules:[
{id:"r8",text:"Nu lăsați aerul condiționat pornit cu geamurile sau ușile deschise",on:true},
{id:"r9",text:"Stingeți luminile, aerul condiționat și TV-ul când plecați din apartament"}]},
{id:"animale",title:"Animale",color:"#c45a7a",rules:[
{id:"r10",text:"Animalele de companie nu sunt permise",on:true}]},
{id:"vizitatori",title:"Vizitatori și ocupare",color:"#d4922a",rules:[
{id:"r11",text:"Doar persoanele din rezervare au acces în apartament"},
{id:"r12",text:"Nu sunt permiși vizitatori neînregistrați peste noapte"},
{id:"r13",text:"Nr. maxim de persoane",field:"maxpers",placeholder:"ex: 4 persoane"}]},
{id:"bucatarie",title:"Bucătărie și grătar",color:"#d4922a",rules:[
{id:"r14",text:"Echipamentele din bucătărie sunt la dispoziția voastră"},
{id:"r15",text:"Grătarul este disponibil în exterior — curățați-l după utilizare"},
{id:"r16",text:"Nu lăsați aragazul/cuptorul pornit nesupravegheat"}]},
{id:"baie",title:"Baia și instalații sanitare",color:"#3a9e5c",rules:[
{id:"r17",text:"Nu aruncați șervețele umede, tampoane sau alte obiecte în toaletă"},
{id:"r18",text:"Semnalați orice scurgere sau problemă la instalații imediat"}]},
{id:"spalat",title:"Mașina de spălat",color:"#888780",rules:[
{id:"r19",text:"Mașina de spălat este la dispoziție"},
{id:"r20",text:"Nu supraîncărcați mașina și nu folosiți cantități excesive de detergent"},
{id:"r21",text:"Nu spălați haine cu vopsea sau substanțe care pot strica mașina"}]},
{id:"chei",title:"Chei și acces",color:"#d44040",rules:[
{id:"r22",text:"Nu copiați cheile / nu dați codul de acces altor persoane"},
{id:"r23",text:"La plecare, returnați cheile / asigurați-vă că ușa este încuiată"}]},
{id:"siguranta",title:"Siguranța",color:"#d4922a",rules:[
{id:"r24",text:"Detectoarele de fum și gaz sunt instalate — nu le dezactivați",on:true},
{id:"r25",text:"Încuiați ușa de la intrare când plecați și noaptea"},
{id:"r26",text:"Nu lăsați focul deschis nesupravegheat (aragaz, lumânări, grătar)"},
{id:"r27",text:"În caz de urgență, sunați la 112"}]},
{id:"copii",title:"Copii",color:"#8a7abf",rules:[
{id:"r28",text:"Copiii trebuie supravegheați permanent de un adult"},
{id:"r29",text:"Proprietarul nu își asumă responsabilitatea pentru siguranța copiilor"}]},
{id:"pagube",title:"Pagube",color:"#d44040",rules:[
{id:"r30",text:"Orice stricăciune se raportează imediat proprietarului",on:true},
{id:"r31",text:"Nu încercați să reparați singuri — contactați proprietarul"},
{id:"r32",text:"Costul reparațiilor/înlocuirilor va fi suportat de către oaspete"}]},
{id:"parcare",title:"Parcarea",color:"#5a8fd4",rules:[
{id:"r33",text:"Loc de parcare inclus"},
{id:"r34",text:"Doar un vehicul pentru fiecare rezervare"},
{id:"r35",text:"Nu blocați accesul altor locatari"}]},
{id:"spatii",title:"Spații comune",color:"#888780",rules:[
{id:"r36",text:"Respectați regulile blocului/clădirii"},
{id:"r37",text:"Nu lăsați obiecte personale în spațiile comune (scară, hol)"}]},
{id:"consumabile",title:"Consumabile",color:"#3a9e5c",rules:[
{id:"r38",text:"Consumabilele de bază sunt incluse (săpun, hârtie igienică, etc.)"},
{id:"r39",text:"Dacă se termină ceva, anunțați proprietarul"}]},
{id:"wifi",title:"Internet / Wi-Fi",color:"#5a8fd4",rules:[
{id:"r40",text:"Rețea și parolă afișate în apartament"},
{id:"r41",text:"Nu descărcați conținut ilegal prin rețeaua noastră"}]},
{id:"zone",title:"Zone restricționate",color:"#888780",rules:[
{id:"r42",text:"Anumite spații de depozitare sunt ale proprietarului — nu le accesați"},
{id:"r43",text:"Nu deschideți tabloul electric decât în caz de pană de curent"}]},
{id:"mobilier",title:"Mobilier și decor",color:"#d4922a",rules:[
{id:"r44",text:"Nu mutați mobila din poziția inițială"},
{id:"r45",text:"Nu puneți cuie, scotch sau adezivi pe pereți"}]},
{id:"checkout",title:"La plecare",color:"#8a7abf",rules:[
{id:"r46",text:"Închideți toate geamurile și ușile"},
{id:"r47",text:"Opriți toate luminile și aparatele electrice"},
{id:"r48",text:"Stingeți aerul condiționat"},
{id:"r49",text:"Lăsați cheile în locul stabilit"}]},
{id:"contact",title:"Contact și urgențe",color:"#3a9e5c",rules:[
{id:"r50",text:"Proprietarii sunt în apropiere și disponibili pentru orice problemă",on:true},
{id:"r51",text:"Nr. telefon proprietar",field:"phone",placeholder:"07xx xxx xxx"}]},
{id:"bunsmt",title:"Bun simț general",color:"#888780",rules:[
{id:"r52",text:"Tratați apartamentul cu grijă — spațiu primitor, amenajat cu gust, echipat cu tot ce aveți nevoie"},
{id:"r53",text:"Orice nelămurire — contactați proprietarul, suntem aproape și vă ajutăm cu plăcere"}]}
];

var state={},fieldValues={},customRules=[],customId=0;
var checkSvg='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}

function saveState(){
try{
var editedTexts={};
SECTIONS.forEach(function(sec){sec.rules.forEach(function(r){
var el=document.getElementById('text-'+r.id);
if(el&&el.textContent.trim()!==r.text)editedTexts[r.id]=el.textContent.trim();
});});
var customData=customRules.map(function(id){
var el=document.getElementById('ctext-'+id);
return el?el.textContent.trim():'';
}).filter(Boolean);
localStorage.setItem('regState',JSON.stringify({state:state,fieldValues:fieldValues,editedTexts:editedTexts,customData:customData}));
}catch(e){}
}
function loadState(){
try{
var saved=JSON.parse(localStorage.getItem('regState'));
if(!saved)return false;
state=saved.state||{};
fieldValues=saved.fieldValues||{};
SECTIONS.forEach(function(sec){sec.rules.forEach(function(r){
if(!(r.id in state))state[r.id]=!!r.on;
});});
return saved;
}catch(e){return false;}
}

function init(){
var saved=loadState();
var container=document.getElementById('sections');
SECTIONS.forEach(function(sec,si){
if(!saved)sec.rules.forEach(function(r){state[r.id]=!!r.on;if(r.field)fieldValues[r.field]='';});
else sec.rules.forEach(function(r){if(r.field&&!(r.field in fieldValues))fieldValues[r.field]='';});
var cc=sec.rules.filter(function(r){return state[r.id]}).length;
var div=document.createElement('div');div.className='section';
div.innerHTML=
'<div class="sec-head'+(si===0?' open':'')+'" onclick="toggleSection(this)" data-sec="'+sec.id+'">'+
'<span class="dot" style="background:'+sec.color+'"></span>'+
'<span class="title">'+sec.title+'</span>'+
'<span class="badge" id="badge-'+sec.id+'">'+cc+'/'+sec.rules.length+'</span>'+
'<span class="arrow">&#9660;</span></div>'+
'<div class="sec-body'+(si===0?' open':'')+'" id="body-'+sec.id+'">'+
sec.rules.map(function(r){
return'<div class="rule'+(state[r.id]?' checked':'')+'" id="rule-'+r.id+'" onclick="toggleRule(\''+r.id+'\',\''+sec.id+'\',event)">'+
'<div class="cb">'+checkSvg+'</div>'+
'<div class="rule-text">'+
'<span class="rule-edit" contenteditable="true" id="text-'+r.id+'" onclick="event.stopPropagation()" oninput="saveState()">'+r.text+'</span>'+
(r.field?'<div class="field"><input type="text" id="field-'+r.field+'" placeholder="'+r.placeholder+'" onclick="event.stopPropagation()" oninput="fieldValues[\''+r.field+'\']=this.value;saveState()"></div>':'')+
'</div></div>';
}).join('')+'</div>';
container.appendChild(div);
});
if(saved){
if(saved.editedTexts){Object.keys(saved.editedTexts).forEach(function(id){
var el=document.getElementById('text-'+id);
if(el)el.textContent=saved.editedTexts[id];
});}
Object.keys(fieldValues).forEach(function(f){
var el=document.getElementById('field-'+f);
if(el)el.value=fieldValues[f]||'';
});
if(saved.customData){saved.customData.forEach(function(text){
var id='c'+(++customId);customRules.push(id);
var div=document.createElement('div');div.className='cr';div.id='crule-'+id;
div.innerHTML=
'<div class="cr-chk">'+checkSvg+'</div>'+
'<span class="cr-text" contenteditable="true" id="ctext-'+id+'" oninput="saveState()">'+esc(text)+'</span>'+
'<button class="cr-del" onclick="removeCustomRule(\''+id+'\')" title="Șterge">&times;</button>';
document.getElementById('customRules').appendChild(div);
});}
}
updateCount();
}

function toggleSection(el){el.classList.toggle('open');document.getElementById('body-'+el.dataset.sec).classList.toggle('open')}

function toggleRule(id,secId,e){
if(e.target.tagName==='INPUT'||e.target.getAttribute('contenteditable'))return;
state[id]=!state[id];
document.getElementById('rule-'+id).classList.toggle('checked',state[id]);
updateBadge(secId);updateCount();saveState();
}

function updateBadge(secId){
var sec=SECTIONS.find(function(s){return s.id===secId});
var c=sec.rules.filter(function(r){return state[r.id]}).length;
document.getElementById('badge-'+secId).textContent=c+'/'+sec.rules.length;
}

function updateCount(){
var n=Object.values(state).filter(Boolean).length+customRules.length;
document.getElementById('count').textContent=n+' regul'+(n===1?'ă selectată':'i selectate');
}

function addCustomRule(){
var input=document.getElementById('newRuleInput');
var text=input.value.trim();if(!text)return;
var id='c'+(++customId);customRules.push(id);
var div=document.createElement('div');div.className='cr';div.id='crule-'+id;
div.innerHTML=
'<div class="cr-chk">'+checkSvg+'</div>'+
'<span class="cr-text" contenteditable="true" id="ctext-'+id+'">'+esc(text)+'</span>'+
'<button class="cr-del" onclick="removeCustomRule(\''+id+'\')" title="Șterge">&times;</button>';
document.getElementById('customRules').appendChild(div);
input.value='';input.focus();updateCount();saveState();
}

function removeCustomRule(id){
customRules=customRules.filter(function(c){return c!==id});
var el=document.getElementById('crule-'+id);if(el)el.remove();updateCount();saveState();
}

document.getElementById('newRuleInput').addEventListener('keydown',function(e){
if(e.key==='Enter'){e.preventDefault();addCustomRule();}
});

async function submitForm(){
var btn=document.getElementById('submitBtn');
var selectedRules=[];
SECTIONS.forEach(function(sec){sec.rules.forEach(function(r){
if(state[r.id]){
var txt=document.getElementById('text-'+r.id).textContent.trim();
if(r.field&&fieldValues[r.field])txt+=': '+fieldValues[r.field];
selectedRules.push(txt);
}});});
customRules.forEach(function(id){
var el=document.getElementById('ctext-'+id);
if(el)selectedRules.push('[NOU] '+el.textContent.trim());
});
if(selectedRules.length===0){document.getElementById('status').textContent='Selectează cel puțin o regulă';return;}
btn.disabled=true;btn.textContent='Se trimite...';
document.getElementById('status').textContent='Se salvează...';
try{
var controller=new AbortController();
var timeout=setTimeout(function(){controller.abort()},15000);
await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({rules:selectedRules.join('\n'),phone:fieldValues.phone||'',maxpers:fieldValues.maxpers||''}),signal:controller.signal});
clearTimeout(timeout);
document.getElementById('formWrap').classList.add('hidden');
document.getElementById('successMsg').classList.add('show');
document.getElementById('status').textContent='Salvat!';
}catch(err){
document.getElementById('status').textContent=err.name==='AbortError'?'Timeout — încearcă din nou':'Eroare de rețea — încearcă din nou';
btn.disabled=false;btn.textContent='Trimite selecția';
}}

function resetForm(){
document.getElementById('formWrap').classList.remove('hidden');
document.getElementById('successMsg').classList.remove('show');
document.getElementById('submitBtn').disabled=false;
document.getElementById('submitBtn').textContent='Trimite selecția';
document.getElementById('status').textContent='';
document.getElementById('customRules').innerHTML='';customRules=[];
SECTIONS.forEach(function(sec){sec.rules.forEach(function(r){
state[r.id]=!!r.on;
document.getElementById('rule-'+r.id).classList.toggle('checked',state[r.id]);
if(r.field){fieldValues[r.field]='';document.getElementById('field-'+r.field).value='';}
});updateBadge(sec.id);});updateCount();
try{localStorage.removeItem('regState')}catch(e){}
}

function toggleTheme(){
document.documentElement.classList.toggle('light');
var isLight=document.documentElement.classList.contains('light');
document.getElementById('themeBtn').innerHTML=isLight?'&#127769;':'&#9728;&#65039;';
try{localStorage.setItem('theme',isLight?'light':'dark')}catch(e){}
}
try{if(localStorage.getItem('theme')==='light'){document.documentElement.classList.add('light');document.getElementById('themeBtn').innerHTML='&#127769;';}}catch(e){}

init();
</script>
</body>
</html>
